<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت سفارش | لیا عارف</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .payment-page {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px 70px;
        }

        .payment-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .payment-header h1 {
            margin-bottom: 10px;
        }

        .payment-header p {
            color: #777;
        }

        .payment-card {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(0,0,0,.06);
        }

        .payment-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 30px;
        }

        .summary-box {
            background: #f8f8f6;
            border-radius: 16px;
            padding: 20px;
        }

        .summary-box span {
            display: block;
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .summary-box strong {
            font-size: 20px;
        }

        .payment-method {
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .payment-method-title {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .payment-method-description {
            color: #777;
            font-size: 14px;
            line-height: 1.8;
        }

        .payment-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .payment-btn {
            border: 0;
            border-radius: 12px;
            padding: 14px 24px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            transition: .2s;
        }

        .payment-btn:hover {
            transform: translateY(-2px);
        }

        .payment-btn-success {
            background: #222;
            color: #fff;
            flex: 1;
        }

        .payment-btn-fail {
            background: #f3f3f1;
            color: #333;
        }

        .payment-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            line-height: 1.8;
        }

        .payment-message.success {
            display: block;
            background: #edf8ef;
            color: #246b31;
        }

        .payment-message.error {
            display: block;
            background: #fff0f0;
            color: #a52b2b;
        }

        .payment-loading {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media (max-width: 650px) {
            .payment-page {
                margin-top: 25px;
            }

            .payment-card {
                padding: 20px;
            }

            .payment-summary {
                grid-template-columns: 1fr;
            }

            .payment-actions {
                flex-direction: column;
            }

            .payment-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">
        <a href="index.html" class="logo">لیا عارف</a>

        <nav>
            <a href="index.html">خانه</a>
            <a href="index.html#categories">دسته‌بندی‌ها</a>
            <a href="cart.html">سبد خرید</a>
        </nav>
    </div>
</header>

<main class="payment-page">

    <div class="payment-header">
        <h1>پرداخت سفارش</h1>
        <p>اطلاعات سفارش خود را بررسی کنید و پرداخت را انجام دهید.</p>
    </div>

    <div id="payment-content">
        <div class="payment-loading">
            در حال دریافت اطلاعات سفارش...
        </div>
    </div>

</main>

<footer class="site-footer">
    <div class="container">
        <p>لیا عارف</p>
        <p>انتخابی برای مراقبت، زیبایی و حال خوب شما.</p>
        <small>© لیا عارف</small>
    </div>
</footer>

<script src="payment.js"></script>

</body>
</html>
