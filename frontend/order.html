<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سفارش من | لیا عارف</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .order-page {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 24px;
        }

        .order-title {
            font-size: 30px;
            margin-bottom: 30px;
        }

        .order-box {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,.04);
        }

        .order-loading,
        .order-error,
        .order-empty {
            text-align: center;
            padding: 50px 20px;
            color: #666;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-bottom: 22px;
            border-bottom: 1px solid #eee;
            margin-bottom: 22px;
        }

        .order-number {
            font-size: 18px;
            font-weight: 700;
        }

        .order-status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 30px;
            background: #edf8f4;
            color: #438b74;
            font-size: 13px;
        }

        .order-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .info-item {
            background: #fafafa;
            border-radius: 12px;
            padding: 15px;
        }

        .info-label {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
        }

        .order-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 16px;
            border: 1px solid #eee;
            border-radius: 14px;
        }

        .order-item-name {
            font-weight: 600;
        }

        .order-item-meta {
            margin-top: 7px;
            color: #777;
            font-size: 13px;
        }

        .order-item-price {
            font-weight: 700;
            white-space: nowrap;
        }

        .order-total {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
        }

        .order-actions {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .order-button {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 12px;
            background: #171717;
            color: #fff;
            text-decoration: none;
        }

        .order-button.secondary {
            background: #f3f3f3;
            color: #222;
        }

        @media (max-width: 700px) {
            .order-info {
                grid-template-columns: 1fr;
            }

            .order-header,
            .order-item,
            .order-total {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a href="index.html" class="logo">
            لیا عارف
        </a>

        <nav class="main-nav">
            <a href="index.html#categories">دسته‌بندی‌ها</a>
            <a href="index.html#bestsellers">پرفروش‌ها</a>
            <a href="index.html#brands">برندها</a>
        </nav>

        <div class="header-actions">
            <a href="cart.html" class="cart-link">
                سبد خرید
                <span id="cart-count">0</span>
            </a>
        </div>

    </div>
</header>

<main class="order-page">

    <h1 class="order-title">
        سفارش من
    </h1>

    <div id="order-content" class="order-box">
        <div class="order-loading">
            در حال دریافت اطلاعات سفارش...
        </div>
    </div>

</main>

<footer class="site-footer">
    <div class="footer-inner">
        <div>
            <div class="footer-logo">لیا عارف</div>
            <p class="footer-about">
                انتخابی برای مراقبت، زیبایی و حال خوب شما.
            </p>
        </div>
    </div>

    <div class="footer-bottom">
        © لیا عارف
    </div>
</footer>

<script src="order.js"></script>

</body>
</html>
