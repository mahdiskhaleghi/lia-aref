<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سبد خرید | لیا عارف</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="home.css">

    <style>
        .cart-page {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px 80px;
        }

        .cart-title {
            margin-bottom: 30px;
        }

        .cart-title h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .cart-title p {
            color: #777;
            margin: 0;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 25px;
            align-items: start;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 18px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-item-image {
            width: 120px;
            height: 120px;
            border-radius: 14px;
            background: #f7f7f5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            margin: 0 0 10px;
            font-size: 17px;
        }

        .cart-price {
            color: #333;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 34px;
            height: 34px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 9px;
            cursor: pointer;
            font-size: 18px;
        }

        .quantity-btn:hover {
            background: #f5f5f5;
        }

        .quantity-number {
            min-width: 25px;
            text-align: center;
            font-weight: 600;
        }

        .cart-item-total {
            min-width: 130px;
            text-align: left;
            font-weight: 700;
        }

        .remove-btn {
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }

        .remove-btn:hover {
            color: #c44;
        }

        .cart-summary {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 18px;
            padding: 25px;
            position: sticky;
            top: 90px;
        }

        .cart-summary h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 21px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            color: #555;
        }

        .summary-total {
            border-top: 1px solid #eee;
            padding-top: 18px;
            margin-top: 18px;
            font-size: 18px;
            font-weight: 700;
            color: #222;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px;
            margin-top: 25px;
            background: #222;
            color: #fff;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .checkout-btn:hover {
            opacity: .9;
        }

        .continue-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .empty-cart {
            text-align: center;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 18px;
            padding: 70px 20px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .loading-cart {
            text-align: center;
            padding: 60px;
            color: #777;
        }

        @media (max-width: 850px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }
        }

        @media (max-width: 600px) {
            .cart-item {
                flex-wrap: wrap;
            }

            .cart-item-image {
                width: 90px;
                height: 90px;
            }

            .cart-item-total {
                width: 100%;
                text-align: right;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="header-inner">

            <a href="index.html" class="logo">
                لیا عارف
            </a>

            <nav class="main-nav">
                <a href="index.html#categories">دسته‌بندی‌ها</a>
                <a href="index.html#bestsellers">پرفروش‌ها</a>
                <a href="index.html#brands">برندها</a>
                <a href="index.html#popular">پربازدیدها</a>
                <a href="index.html#new-products">تازه‌ها</a>
            </nav>

            <div class="header-actions">
                <a href="login.html">ورود</a>
                <a href="cart.html">
                    سبد خرید
                    (<span id="cart-count">0</span>)
                </a>
            </div>

        </div>
    </header>


    <main class="cart-page">

        <div class="cart-title">
            <h1>سبد خرید</h1>
            <p>محصولات انتخاب‌شده شما</p>
        </div>

        <div id="cart-content">
            <div class="loading-cart">
                در حال بارگذاری سبد خرید...
            </div>
        </div>

    </main>


    <script src="cart.js"></script>

</body>
</html>
